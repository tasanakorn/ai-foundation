# ai-foundation gateway config. Copy to aif.yaml and edit.
# ${VAR} and ${VAR:-default} are read from the environment.

server:
  listen: ${AIF_LISTEN:-:8080}   # public API: OpenAI at /v1 (and /openai/v1), Anthropic at /anthropic
  upstream_timeout: 10m      # max time for one upstream call (streams included)
  max_body_bytes: 33554432   # 32 MiB
  # Anthropic Messages API for Claude Code and Anthropic SDK apps (docs/specs/spec-0002).
  # Clients use base URL https://<gateway>/anthropic (without /v1).
  anthropic:
    path_prefix: ${AIF_ANTHROPIC_PREFIX:-/anthropic}   # "" = not on the main listener
    listen: ${AIF_ANTHROPIC_LISTEN:-off}               # optional own port, API at its root, e.g. :8082
  # Behind a reverse proxy (ingress, CDN, load balancer), list the proxies that may set the
  # client IP header. Empty = the client IP is the TCP peer. Used by the admin sign-in throttle
  # and logs (docs/specs/spec-0003 section 3). Comma list in the env, e.g. "10.0.0.0/8,192.168.0.0/16".
  trusted_proxies: [${AIF_TRUSTED_PROXIES:-}]
  client_ip_header: ${AIF_CLIENT_IP_HEADER:-X-Forwarded-For}   # or X-Real-IP, CF-Connecting-IP, ...

# Prometheus metrics at GET /metrics on their own listener (spec-0003 section 4).
# Keep it off the public ingress. "off" disables it.
metrics:
  listen: ${AIF_METRICS_LISTEN:-off}   # e.g. :9090

admin:
  # Admin API (+ web UI). Default: localhost only. Public: AIF_ADMIN_LISTEN=0.0.0.0:8081 (or ":8081").
  # "off" disables it. Put TLS in front (reverse proxy) when it is public.
  listen: ${AIF_ADMIN_LISTEN:-127.0.0.1:8081}
  # ui_dir: ./web/.output/public   # serve the built web UI here
  # People sign in with built-in accounts (email + password). Manage them in the UI or with
  # `aif admin create-user | reset-password | list-users`.
  session_ttl: 12h            # browser login lifetime
  cookie_secure: auto         # auto = Secure cookie on HTTPS (or X-Forwarded-Proto: https); always; never
  # First start only: creates this admin account when no account exists. Change the password after sign-in.
  bootstrap:
    email: ${AIF_ADMIN_EMAIL:-}
    password: ${AIF_ADMIN_PASSWORD:-}
  # Optional bearer token with the admin role, for scripts and emergency access. Empty = off.
  master_key: ${AIF_MASTER_KEY:-}

# PostgreSQL is required (D15). Migrations run at startup.
database:
  url: ${DATABASE_URL}        # postgres://user:pass@host:5432/aif?sslmode=require
  max_conns: 10               # pool size per node

metering:
  buffer_size: 10000         # in-memory queue; records drop (and are counted) when full
  batch_size: 200
  flush_interval: 1s

# NATS is required. Extensions in any language plug in here (see docs/specs/spec-0001 §8).
nats:
  url: ${NATS_URL:-nats://127.0.0.1:4222}
  creds: ${NATS_CREDS:-}       # optional .creds file (JWT + nkey)
  connect_timeout: 5s          # startup fails if NATS is not reachable; later it reconnects forever
  usage:
    subject_prefix: aif.usage.v1   # one JSON record per request on <prefix>.<tenant>.<app>
    jetstream: true                # durable stream with dedup by request ID
    stream: AIF_USAGE
    max_age: 720h                  # retention, used only when the gateway creates the stream
  control:
    subject_prefix: aif.control.v1 # key_revoked: every node drops the key at once
  hooks:
    pre_request:                   # request/reply: allow, deny or modify before upstream
      subject: ""                  # empty = off, e.g. aif.hook.pre_request.v1
      timeout: 200ms
      fail_open: false             # no answer in time: false = 503, true = allow
      models: ["*"]                # key allow-list patterns
      formats: [openai]            # add anthropic to also check /anthropic requests (body = Anthropic format)

# Allow "<provider>/<upstream model>" for any model, e.g. "openrouter/anthropic/claude-sonnet-4.5".
passthrough: true

providers:
  - name: openrouter
    type: openrouter          # OpenAI-compatible; base_url defaults to https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    headers:
      X-Title: ai-foundation

  - name: openai
    type: openai
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}

  # Claude API. A key from the Console org linked to a Max, Ultra or Team plan spends
  # the plan's monthly API credits first (docs/specs/spec-0002).
  - name: anthropic
    type: anthropic              # base_url defaults to https://api.anthropic.com/v1
    api_key: ${ANTHROPIC_API_KEY}
    openai_format: compat        # required: OpenAI-format requests use Anthropic's OpenAI-compatible endpoint
    # workspace_id: wrkspc_...   # only for keys not scoped to one workspace

  # llama.cpp:  llama-server -m model.gguf --port 8090 --alias qwen
  #             add "--embeddings --pooling mean" to serve /v1/embeddings
  - name: llamacpp
    type: openai
    base_url: http://localhost:8090/v1

  # vLLM:  vllm serve Qwen/Qwen2.5-7B-Instruct --port 8000 --served-model-name qwen [--api-key ...]
  - name: vllm
    type: openai
    base_url: http://localhost:8000/v1
    api_key: ${VLLM_API_KEY:-}

# Aliases. Clients send "name"; the gateway sends "upstream" to "provider".
# price is USD per 1M tokens. If the provider reports cost (OpenRouter), that wins.
# cache_write (Anthropic prompt-cache writes) defaults to 1.25 x input.
# formats: which APIs may use the alias. Default [openai]; [openai, anthropic] on anthropic providers.
models:
  - name: gpt-4o-mini
    provider: openai
    price: { input: 0.15, output: 0.60, cached_input: 0.075 }

  # Claude: keep alias = real model ID (Claude Code drops IDs without "claude").
  # On /v1, compat mode does not report cached tokens; on /anthropic, cache reads and writes are metered.
  - name: claude-opus-5-5
    provider: anthropic
    price: { input: 4.00, output: 20.00, cached_input: 0.20 }

  - name: claude-sonnet-5-5
    provider: anthropic
    price: { input: 2.00, output: 10.00, cached_input: 0.10 }

  - name: claude-haiku-5-5
    provider: anthropic
    price: { input: 0.10, output: 0.50 }   # prompts up to 100K tokens; 0.50 / 2.50 beyond

  - name: fast
    provider: openrouter
    upstream: google/gemini-2.5-flash

  - name: qwen-local
    provider: llamacpp
    upstream: qwen             # must match llama-server --alias

  - name: qwen-gpu
    provider: vllm
    upstream: qwen             # must match vllm --served-model-name
