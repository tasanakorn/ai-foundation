# Dev config used by scripts/dev.py. Local only. Do not use in production.

server:
  listen: ${AIF_LISTEN:-127.0.0.1:8080}

admin:
  listen: ${AIF_ADMIN_LISTEN:-127.0.0.1:8081}
  master_key: ${AIF_MASTER_KEY:-dev-master-key-0000}

database:
  driver: sqlite
  dsn: ${AIF_DB:-aif.dev.db}

metering:
  flush_interval: 200ms

# Required. `make dev` starts NATS (JetStream) in Docker.
nats:
  url: ${NATS_URL:-nats://127.0.0.1:4222}
  hooks:
    pre_request:
      subject: aif.hook.pre_request.v1
      fail_open: true          # dev: allow when no extension runs (see extensions/example-budget)

passthrough: true

providers:
  - name: openrouter
    type: openrouter
    api_key: ${OPENROUTER_API_KEY}
    headers:
      X-Title: ai-foundation-dev

  - name: llamacpp
    type: openai
    base_url: ${LLAMACPP_URL:-http://127.0.0.1:8090/v1}

models:
  - name: mini
    provider: openrouter
    upstream: openai/gpt-4o-mini

  - name: local
    provider: llamacpp
    upstream: local            # scripts/dev.py starts llama-server with --alias local
