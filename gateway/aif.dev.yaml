# Dev config used by scripts/dev.py. Local only. Do not use in production.

# Allows the public dev secrets below (spec-0003 D23). Never set this in production.
dev_mode: true

# Prometheus metrics: curl 127.0.0.1:9090/metrics
metrics:
  listen: ${AIF_METRICS_LISTEN:-127.0.0.1:9090}

server:
  listen: ${AIF_LISTEN:-127.0.0.1:8080}

admin:
  listen: ${AIF_ADMIN_LISTEN:-127.0.0.1:8081}
  master_key: ${AIF_MASTER_KEY:-dev-master-key-0000}
  bootstrap:   # first start only; sign in to the UI with this
    email: ${AIF_ADMIN_EMAIL:-admin@example.com}
    password: ${AIF_ADMIN_PASSWORD:-dev-admin-password}
    name: Dev Admin

# `make dev` starts PostgreSQL in Docker (deploy/local/compose.yaml).
database:
  url: ${DATABASE_URL:-postgres://aif:aif-dev@127.0.0.1:5432/aif?sslmode=disable}

metering:
  flush_interval: 200ms

# Required. `make dev` starts NATS (JetStream) in Docker.
nats:
  url: ${NATS_URL:-nats://127.0.0.1:4222}
  hooks:
    pre_request:
      subject: aif.hook.pre_request.v1
      fail_open: true          # dev: allow when no extension runs (see extensions/example-budget)

# Dev: the file is the source of truth, so edits here apply without a restart.
catalog:
  mode: ${AIF_CATALOG_MODE:-file}

passthrough: true

providers:
  - name: openrouter
    type: openrouter
    api_key: ${OPENROUTER_API_KEY}
    headers:
      X-Title: ai-foundation-dev

  - name: llamacpp
    type: openai
    base_url: ${LLAMACPP_URL:-http://127.0.0.1:8090/v1}

  # Claude API: OpenAI format at /v1, Anthropic format at /anthropic (spec-0002).
  - name: anthropic
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    openai_format: compat

models:
  - name: claude-opus-5-5
    provider: anthropic
    price: { input: 4.00, output: 20.00, cached_input: 0.20 }

  - name: claude-sonnet-5-5
    provider: anthropic
    price: { input: 2.00, output: 10.00, cached_input: 0.10 }

  - name: claude-haiku-5-5
    provider: anthropic
    price: { input: 0.10, output: 0.50 }

  - name: mini
    provider: openrouter
    upstream: openai/gpt-4o-mini

  - name: local
    provider: llamacpp
    upstream: local            # scripts/dev.py starts llama-server with --alias local
