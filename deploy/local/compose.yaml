# Backing services for local development.
# The gateway and web UI run natively (make dev) for a fast loop; this file runs the services they use.
#
#   make services-up      start (waits until healthy)
#   make services-down    stop, keep data
#   make services-reset   stop and delete data
#
# Values come from the repo-root .env (see .env.example). Ports bind to 127.0.0.1 only.

name: aif-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aif-dev}
      POSTGRES_DB: ${POSTGRES_DB:-aif}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql   # Postgres 18+ image layout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  nats:
    image: nats:2.15-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222", "--server_name", "aif-dev"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"           # clients
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"   # monitoring: /healthz, /varz, /jsz
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
